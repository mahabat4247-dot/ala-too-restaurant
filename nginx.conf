# Server block installed as /etc/nginx/conf.d/default.conf in the image.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached for a long time.
    location ~* \.(?:css|js)$ {
        expires 1y;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
